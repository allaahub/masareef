<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8f5d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>مصاريفي</title>
<style>
/* VOICE: calm, personal money notebook; quick to use one-handed.
   IDEA: a pocket ledger — balance on the cover, entries below.
   PICTURE: the big mint balance card + the add form, at the top.
   COLOUR and TYPE: black/white plus one mint field; IBM Plex Sans Arabic.
   LAYOUT: single column, 560px max, phone-first. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0b0b0b);--ink:light-dark(#111,#f2f2f2);--mut:light-dark(#666,#a3a3a3);--line:light-dark(#e6e6e6,#262626);--card:light-dark(#f6f6f6,#161616);--mint:#b8f5d0;--mintink:#0b3d22;--red:light-dark(#b42318,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"SF Arabic","Geeza Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bk button,.bk label{background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:15px;display:flex;align-items:center;justify-content:center;border-radius:14px;min-height:48px;margin:0;cursor:pointer}
.bk input{display:none}
h1{font-size:22px;margin:4px 0 12px;font-weight:700}
.bal{background:var(--mint);color:var(--mintink);border-radius:20px;padding:20px}
.bal small{font-size:14px;display:block}
.big{font-size:clamp(38px,11vw,52px);font-weight:700;line-height:1.1;white-space:nowrap}
.big.neg{color:#8a1c12}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.row3 div{background:rgba(255,255,255,.55);border-radius:12px;padding:8px 10px;font-size:14px}
.row3 b{display:block;font-size:18px;white-space:nowrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:48px;padding:0 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2e7d4f;outline-offset:2px}
.b-ex{background:var(--ink);color:var(--bg);font-weight:700}
.b-in{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.panel[hidden]{display:none}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select{font:inherit;font-size:16px;width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);color:var(--ink)}
.amt{font-size:26px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:0 14px;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save{width:100%;margin-top:14px;background:var(--mint);color:var(--mintink);font-weight:700;font-size:17px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:6px}
h2{font-size:18px;margin:22px 0 8px}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mbar button{background:var(--card);border:1px solid var(--line);color:var(--ink);min-width:48px;font-size:20px}
.mname{font-weight:700;font-size:18px;text-align:center}
.mtot{font-size:15px;color:var(--mut);text-align:center;margin:6px 0 10px}
.mtot b{color:var(--ink);font-size:22px}
.cat{display:grid;grid-template-columns:7.5em 1fr auto;align-items:center;gap:8px;font-size:15px;margin:6px 0}
.track{height:12px;background:var(--card);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--ink);border-radius:6px}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.day{font-size:13px;color:var(--mut);margin:14px 0 4px;border-bottom:1px solid var(--line);padding-bottom:4px}
.it{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.it .t{font-weight:500}.it .n{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.it .a{font-weight:700}.it .a.in{color:#1f7a45}
.del{min-height:40px;min-width:40px;background:transparent;color:var(--mut);font-size:18px;padding:0 8px}
.del.sure{background:var(--red);color:#fff;font-size:13px}
.empty{color:var(--mut);text-align:center;padding:20px 0}
.note{font-size:13px;color:var(--mut);text-align:center;margin-top:24px}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
</style>
</head>
<body>
<div class="wrap">
  <h1>مصاريفي</h1>

  <section class="bal" aria-live="polite">
    <small>الباقي معايا</small>
    <div class="big" id="bal">0 ج</div>
    <div class="row3">
      <div>صرفت الشهر ده<b id="mSpent">0 ج</b></div>
      <div>دخل الشهر ده<b id="mIn">0 ج</b></div>
    </div>
  </section>

  <div class="acts">
    <button class="b-ex" id="openEx">− سجّل مصروف</button>
    <button class="b-in" id="openIn">+ فلوس دخلت</button>
  </div>

  <form class="panel" id="form" hidden>
    <div style="font-weight:700" id="formTitle">مصروف جديد</div>
    <label for="amt">المبلغ (جنيه)</label>
    <input id="amt" class="amt" inputmode="decimal" autocomplete="off" placeholder="0">
    <div id="catWrap">
      <label>صرفته في إيه؟</label>
      <div class="chips" id="chips"></div>
    </div>
    <label for="note">ملاحظة (اختياري)</label>
    <input id="note" maxlength="80" placeholder="مثلاً: عيش وخضار">
    <div class="two">
      <div><label for="date">التاريخ</label><input id="date" type="date"></div>
      <div style="display:flex;align-items:flex-end"><button type="button" class="b-in" id="cancel" style="width:100%">إلغاء</button></div>
    </div>
    <button class="save" type="submit">حفظ</button>
    <div class="err" id="err"></div>
  </form>

  <h2>كل شهر</h2>
  <div class="mbar">
    <button id="prev" aria-label="الشهر اللي قبله">›</button>
    <div class="mname" id="mname"></div>
    <button id="next" aria-label="الشهر اللي بعده">‹</button>
  </div>
  <div class="mtot">مصاريف الشهر: <b class="num" id="mTot">0 ج</b></div>
  <div id="cats"></div>

  <h2>اللي اتسجّل في الشهر ده</h2>
  <div id="list"></div>

  <h2>نسخة احتياطية</h2>
  <div class="mtot" style="text-align:start">بياناتك محفوظة على الموبايل ده بس. احفظ نسخة كل فترة في Files أو ابعتها لنفسك على واتساب، علشان لو غيّرت الموبايل.</div>
  <div class="bk">
    <button type="button" id="exp">احفظ نسخة</button>
    <label for="imp">رجّع من نسخة<input type="file" id="imp" accept=".json,application/json"></label>
  </div>
  <div class="note" id="status"></div>
</div>

<script>
{
const CATS = ["أكل وبقالة","مواصلات","بيت","فواتير","أولاد ومدارس","لبس","صحة","خروج","تانية"];
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString("en-US") + " ج";
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

let txs = [];
let kind = "exp";
let cat = CATS[0];
let view = today().slice(0,7);
let pendingDel = null;

function loadLocal(){ try { txs = JSON.parse(localStorage.getItem("masareef") || "[]"); } catch(e){ txs = []; } }
function saveLocal(){ try { localStorage.setItem("masareef", JSON.stringify(txs)); } catch(e){} }

$("chips").innerHTML = CATS.map(c => `<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join("");
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  cat = b.dataset.c;
  for (const x of $("chips").children) x.setAttribute("aria-pressed", x.dataset.c === cat);
});

function openForm(k){
  kind = k;
  $("formTitle").textContent = k === "exp" ? "مصروف جديد" : "فلوس دخلت (مرتب، فلوس معاكي…)";
  $("catWrap").hidden = k !== "exp";
  $("note").placeholder = k === "exp" ? "مثلاً: عيش وخضار" : "مثلاً: المرتب";
  $("date").value = today(); $("amt").value = ""; $("note").value = ""; $("err").textContent = "";
  $("form").hidden = false; $("amt").focus();
}
$("openEx").onclick = () => openForm("exp");
$("openIn").onclick = () => openForm("inc");
$("cancel").onclick = () => { $("form").hidden = true; };

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const raw = $("amt").value.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[,٬]/g, "").replace("٫", ".");
  const amount = parseFloat(raw);
  if (!(amount > 0)) { $("err").textContent = "اكتب المبلغ الأول"; return; }
  const t = { id: "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), type: kind, amount,
              cat: kind === "exp" ? cat : "", note: $("note").value.trim().slice(0,80), date: $("date").value || today(), created: Date.now() };
  $("form").hidden = true;
  view = t.date.slice(0,7);
  txs.push(t); saveLocal(); render();
});

async function remove(id){
  txs = txs.filter(t => t.id !== id); saveLocal(); render();
}

$("list").addEventListener("click", e => {
  const b = e.target.closest(".del"); if (!b) return;
  if (pendingDel === b.dataset.id) { pendingDel = null; remove(b.dataset.id); return; }
  pendingDel = b.dataset.id; render();
  setTimeout(() => { if (pendingDel === b.dataset.id) { pendingDel = null; render(); } }, 3000);
});

function shift(n){ let [y,m] = view.split("-").map(Number); m += n; if (m < 1){m = 12; y--;} if (m > 12){m = 1; y++;} view = `${y}-${String(m).padStart(2,"0")}`; render(); }
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);

function render(){
  const valid = txs.filter(t => t && t.amount > 0 && typeof t.date === "string");
  let bal = 0; for (const t of valid) bal += t.type === "inc" ? t.amount : -t.amount;
  $("bal").textContent = fmt(bal); $("bal").classList.toggle("neg", bal < 0);
  const cur = today().slice(0,7);
  const sum = (m, ty) => valid.filter(t => t.date.slice(0,7) === m && t.type === ty).reduce((a,t) => a + t.amount, 0);
  $("mSpent").textContent = fmt(sum(cur,"exp")); $("mIn").textContent = fmt(sum(cur,"inc"));

  const [y,m] = view.split("-").map(Number);
  $("mname").textContent = `${MONTHS[m-1]} ${y}`;
  const month = valid.filter(t => t.date.slice(0,7) === view);
  const exps = month.filter(t => t.type === "exp");
  const tot = exps.reduce((a,t) => a + t.amount, 0);
  $("mTot").textContent = fmt(tot);
  const byCat = {}; for (const t of exps) byCat[t.cat || "تانية"] = (byCat[t.cat || "تانية"] || 0) + t.amount;
  const rows = Object.entries(byCat).sort((a,b) => b[1] - a[1]);
  $("cats").innerHTML = rows.length ? rows.map(([c,v]) =>
    `<div class="cat"><span>${esc(c)}</span><div class="track"><div class="fill" style="width:${(v/tot*100).toFixed(1)}%"></div></div><span class="num">${esc(fmt(v))}</span></div>`).join("")
    : `<div class="empty">مفيش مصاريف متسجّلة في الشهر ده</div>`;

  month.sort((a,b) => b.date.localeCompare(a.date) || b.created - a.created);
  let html = "", lastDay = "";
  for (const t of month) {
    if (t.date !== lastDay) { lastDay = t.date; const [yy,mm,dd] = t.date.split("-").map(Number); html += `<div class="day">${dd} ${MONTHS[mm-1]}</div>`; }
    const title = t.type === "inc" ? "فلوس دخلت" : (t.cat || "تانية");
    const sure = pendingDel === t.id;
    html += `<div class="it"><div><div class="t">${esc(title)}</div>${t.note ? `<div class="n">${esc(t.note)}</div>` : ""}</div>
      <div class="a num ${t.type === "inc" ? "in" : ""}">${t.type === "inc" ? "+" : "−"}${esc(fmt(t.amount))}</div>
      <button class="del ${sure ? "sure" : ""}" data-id="${esc(t.id)}" aria-label="مسح">${sure ? "امسح؟" : "✕"}</button></div>`;
  }
  $("list").innerHTML = html || `<div class="empty">لسه مفيش حاجة متسجّلة في الشهر ده.</div>`;
}
function setStatus(s){ $("status").textContent = s; }

loadLocal(); render();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

$("exp").onclick = async () => {
  const name = "masareef-" + today() + ".json";
  const blob = new Blob([JSON.stringify({app:"masareef",v:1,txs}, null, 1)], {type:"application/json"});
  try {
    const f = new File([blob], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[f]})) { await navigator.share({files:[f], title:"مصاريفي"}); setStatus("النسخة اتحفظت"); return; }
  } catch(e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setStatus("النسخة اتحفظت");
};
$("imp").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : data.txs;
    if (!Array.isArray(list)) throw 0;
    const ids = new Set(txs.map(t => t.id)); let added = 0;
    for (const t of list) if (t && t.id && t.amount > 0 && typeof t.date === "string" && !ids.has(t.id)) { txs.push(t); added++; }
    saveLocal(); render(); setStatus(`اترجّع ${added} عملية`);
  } catch(err) { setStatus("الملف ده مش نسخة من مصاريفي"); }
};

if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
}
</script>
</body>
</html>
